services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: sqlite:////app/data/logs.db
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      API_TOKEN: ${API_TOKEN:-}
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      DEBUG: "true"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs

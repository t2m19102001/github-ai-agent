services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/logs.db}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      REPO_FULL_NAME: ${REPO_FULL_NAME:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      API_TOKEN: ${API_TOKEN:?API_TOKEN is required for production}
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      DEBUG: "false"
    volumes:
      - agent_data:/app/data
      - agent_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  agent_data:
  agent_logs:
